services:
  - type: web
    name: reliefchain-ai
    runtime: python
    rootDir: backend
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        value: sqlite:///./reliefchain.db
      - key: STORAGE_PATH
        value: ./storage/uploads
