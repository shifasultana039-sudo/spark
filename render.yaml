services:
  - type: web
    name: reliefchain-ai
    runtime: python
    rootDir: backend
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        value: sqlite:///./reliefchain.db
      - key: STORAGE_PATH
        value: ./storage/uploads
      - key: MST_RPC_URL
        value: https://testnetrpc.mstblockchain.com
      - key: MST_CONTRACT_ADDRESS
        value: 0x84AB4dC72536D55aDa9617b673dd33AC9d709d14
      - key: MST_EXPLORER_URL
        value: https://mstscan.com
